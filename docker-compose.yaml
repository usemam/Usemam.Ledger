services:
  mongodb:
    image: mongo:7
    container_name: ledger-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: ledger-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

  api:
    build:
      context: .
      dockerfile: src/Usemam.Ledger.API/Dockerfile
    container_name: ledger-api
    ports:
      - "5001:5000"
    environment:
      - StorageType=mongo
      - MongoConnectionString=mongodb://admin:password@mongodb:27017
      - MongoDatabaseName=ledger_prod
    depends_on:
      - mongodb

  web:
    build:
      context: .
      dockerfile: src/Usemam.Ledger.Web/Dockerfile
      args:
        VITE_API_URL: http://localhost:5001
    container_name: ledger-web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongodb_data:
